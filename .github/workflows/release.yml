name: Build & Release Windows

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests & build Rust Windows binaries
        shell: pwsh
        run: |
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p touchpad-desktop-gui -p touchpad-win-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable Windows bundle
        shell: pwsh
        run: ./packaging/windows/package-windows.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: touchpad-windows
          path: dist/TouchPadRemote-Windows-Portatil.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: touchpad-windows
          path: dist
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TouchPad Remote Windows ${{ github.ref_name }}"
          body: |
            ## TouchPad Remote — Servidor Windows (${{ github.ref_name }})

            Servidor desktop nativo em **Rust** (sem necessidade de Java), com suporte a **jogos 3D**, **persistência de configurações e dispositivos permitidos**, controle de **Gerenciador de Tarefas e janelas UAC ("Sim/Não")** via Serviço Windows opcional, e troca automática **Multi-PC pela borda da tela** orquestrada pelo celular.

            ### Downloads
            - **`TouchPadRemote-Windows-Portatil.zip`**: versão portátil completa com `TouchPadRemote.exe`, `touchpad-win-service.exe`, `Instalar-Servico-UAC.bat`, `Desinstalar-Servico-UAC.bat` e `Liberar-Firewall-Windows.bat`.

            ### Outras Plataformas
            - **Android**: https://github.com/Henzogabriel954/TouchPadRemote-Android/releases/latest
            - **Linux**: https://github.com/Henzogabriel954/TouchPadRemote-Linux/releases/latest
          files: dist/TouchPadRemote-Windows-Portatil.zip
          fail_on_unmatched_files: true
