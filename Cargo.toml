[workspace]
resolver = "2"
members = [
    "crates/touchpad-protocol",
    "crates/touchpad-storage",
    "crates/touchpad-server-core",
    "crates/touchpad-input-win",
    "crates/touchpad-win-service",
    "crates/touchpad-input-linux",
    "crates/touchpad-desktop-gui",
]

[workspace.package]
version = "2.0.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
if-addrs = "0.13"
directories = "6.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
windows-service = "0.8"
evdev = "0.12"
x11rb = { version = "0.13", features = ["randr", "xtest"] }
eframe = "0.31"
egui = "0.31"
tray-icon = "0.19"
